apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: ""
nameSuffix: ""

namespace: staging

replicas:
  - name: cerbos
    count: 1

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: cerbos
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging-cerbos.conqrse.com

  # WARNING: this replaces the WHOLE of cerbos.yaml, so it is a full copy of
  # base/configmap-config.yaml that happens to differ in three places —
  # apiExplorerEnabled, the CORS origins, and nothing else. Every other line is
  # duplication, which means a change to the base config silently does NOT
  # reach staging. That bit during BL-8 on 2026-07-29: the DSN fix landed in
  # base, rendered correctly for production, and left staging on the old value.
  #
  # ANY EDIT TO base/configmap-config.yaml MUST BE MIRRORED HERE. Verify with
  # `kubectl kustomize k8s/overlays/staging | grep dsn:` rather than trusting
  # that the base edit was enough.
  #
  # It cannot be narrowed with a JSON patch: cerbos.yaml is a single string
  # value, so there is no path to a key inside it. Fixing it properly means
  # restructuring how the config is generated (per-env files via
  # configMapGenerator), which changes the authz service's config layout and is
  # its own piece of work.
  - target:
      kind: ConfigMap
      name: cerbos-config
    patch: |-
      - op: replace
        path: /data/cerbos.yaml
        value: |
          server:
            apiExplorerEnabled: true
            httpListenAddr: "0.0.0.0:3592"
            grpcListenAddr: "0.0.0.0:3593"
            adminAPI:
              enabled: true
              adminCredentials:
                username: cerbos
                passwordHash: JDJ5JDEwJHhvTjd2RjhlNEVZa3hmdVFYMWlrME9XOWNDemV5RzlYcERTYUNHVWZkcWo2ODdRdkhIcUcyCgo=
            cors:
              allowedOrigins:
                - cerbos
                - cerbos.staging.svc.cluster.local
                - staging-cerbos.conqrse.com
              allowedHeaders:
                - accept
                - content-type
                - user-agent
                - x-requested-with
            requestLimits:
              maxActionsPerResource: 100
              maxResourcesPerRequest: 100

          storage:
            driver: "sqlite3"
            sqlite3:
              # BL-8 — must match base/configmap-config.yaml. See the note
              # above the patch: WAL lets readers and one writer coexist, the
              # busy timeout makes a contended write wait instead of failing
              # instantly with SQLITE_BUSY.
              dsn: "/data/cerbos.db?_busy_timeout=5000&_journal_mode=WAL"

          logging:
            level: "info"

          telemetry:
            disabled: true

labels:
  - includeSelectors: true
    pairs:
      environment: staging

images:
  - name: ghcr.io/cerbos/cerbos
    newTag: "0.51.0"
