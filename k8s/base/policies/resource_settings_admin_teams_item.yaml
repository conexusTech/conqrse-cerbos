---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "default"
  resource: "settings:admin_teams:item"
  importDerivedRoles:
    - conqrse_roles
  rules:
    # Admin settings access (all owner/admin at all levels)
    - actions: ["view", "update", "delete"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: '!has(R.attr.retailerId) || P.attr.userLevel == "su" || (P.attr.userLevel == "agency" && P.attr.agencyId == R.attr.agencyId) || (P.attr.userLevel == "retailer" && P.attr.retailerId == R.attr.retailerId)'
      derivedRoles:
        - root_user
        - platform_administrator
        - agency_owner
        - agency_manager
        - retailer_owner
        - retailer_manager
