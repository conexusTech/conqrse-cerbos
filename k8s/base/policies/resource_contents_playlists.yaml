---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "default"
  resource: "contents:playlists"
  importDerivedRoles:
    - conqrse_roles
  rules:
    # Retailer access with product subscription check
    - actions: ["list", "view", "create", "update", "delete", "export", "import"]
      effect: EFFECT_ALLOW
      condition:
        match:
          all:
            of:
              - expr: '["signage"].exists(p, p in P.attr.products)'
              - expr: '(!has(R.attr.retailerId) && !has(R.attr.agencyId)) || P.attr.userLevel == "su" || (P.attr.userLevel == "agency" && ((has(R.attr.agencyId) && P.attr.agencyId == R.attr.agencyId) || (has(R.attr.retailerId) && has(P.attr.retailerId) && P.attr.retailerId == R.attr.retailerId))) || (P.attr.userLevel == "retailer" && has(R.attr.retailerId) && P.attr.retailerId == R.attr.retailerId)'
              - expr: 'P.attr.userLevel == "su" || P.attr.userLevel == "agency" || P.attr.userType == "owner" || P.attr.userType == "admin" || (has(R.attr.accessMode) && R.attr.accessMode == "all") || (!has(R.attr.accessMode) && (!has(R.attr.teamIds) || size(R.attr.teamIds) == 0)) || ((!has(R.attr.accessMode) || R.attr.accessMode == "restricted") && has(R.attr.teamIds) && has(P.attr.teamIds) && R.attr.teamIds.exists(teamId, teamId in P.attr.teamIds))'
      derivedRoles:
        - root_user
        - platform_administrator
        - platform_lead
        - platform_member
        - agency_owner
        - agency_manager
        - agency_lead
        - agency_member
        - retailer_owner
        - retailer_manager
        - team_lead
        - staff_operator

    # Collaborators with product subscription check
    - actions: ["list", "view", "export"]
      effect: EFFECT_ALLOW
      condition:
        match:
          all:
            of:
              - expr: '["signage"].exists(p, p in P.attr.products)'
              - expr: '(!has(R.attr.retailerId) && !has(R.attr.agencyId)) || P.attr.userLevel == "su" || (P.attr.userLevel == "agency" && ((has(R.attr.agencyId) && P.attr.agencyId == R.attr.agencyId) || (has(R.attr.retailerId) && has(P.attr.retailerId) && P.attr.retailerId == R.attr.retailerId))) || (P.attr.userLevel == "retailer" && has(R.attr.retailerId) && P.attr.retailerId == R.attr.retailerId)'
              - expr: 'P.attr.userLevel == "su" || P.attr.userLevel == "agency" || P.attr.userType == "owner" || P.attr.userType == "admin" || (has(R.attr.accessMode) && R.attr.accessMode == "all") || (!has(R.attr.accessMode) && (!has(R.attr.teamIds) || size(R.attr.teamIds) == 0)) || ((!has(R.attr.accessMode) || R.attr.accessMode == "restricted") && has(R.attr.teamIds) && has(P.attr.teamIds) && R.attr.teamIds.exists(teamId, teamId in P.attr.teamIds))'
      derivedRoles:
        - root_user
        - platform_administrator
        - platform_lead
        - platform_member
        - platform_collaborator
        - agency_owner
        - agency_manager
        - agency_lead
        - agency_member
        - agency_collaborator
        - guest_collaborator
