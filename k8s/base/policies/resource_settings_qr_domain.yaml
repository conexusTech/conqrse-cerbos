---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "default"
  resource: "settings:qr_domain"
  importDerivedRoles:
    - conqrse_roles
  rules:
    # Settings access with product subscription check (owner/admin only)
    - actions: ["list", "view", "create", "update", "delete", "export", "import"]
      effect: EFFECT_ALLOW
      condition:
        match:
          all:
            of:
              - expr: '["qr"].exists(p, p in P.attr.products)'
              - expr: '(!has(R.attr.retailerId) && !has(R.attr.agencyId)) || P.attr.userLevel == "su" || (P.attr.userLevel == "agency" && ((has(R.attr.agencyId) && P.attr.agencyId == R.attr.agencyId) || (has(R.attr.retailerId) && has(P.attr.retailerId) && P.attr.retailerId == R.attr.retailerId))) || (P.attr.userLevel == "retailer" && has(R.attr.retailerId) && P.attr.retailerId == R.attr.retailerId)'
      derivedRoles:
        - root_user
        - platform_administrator
        - platform_lead
        - agency_owner
        - agency_manager
        - agency_lead
        - retailer_owner
        - retailer_manager
