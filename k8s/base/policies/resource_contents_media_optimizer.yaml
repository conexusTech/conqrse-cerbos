---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "default"
  resource: "contents:media_optimizer"
  importDerivedRoles:
    - conqrse_roles
  rules:
    # Read access for any tier holding the product
    - actions: ["view"]
      effect: EFFECT_ALLOW
      condition:
        match:
          all:
            of:
              - expr: '["signage"].exists(p, p in P.attr.products)'
      derivedRoles:
        - root_user
        - platform_administrator
        - platform_lead
        - platform_member
        - platform_collaborator
        - agency_owner
        - agency_manager
        - agency_lead
        - agency_member
        - agency_collaborator
        - retailer_owner
        - retailer_manager
        - team_lead
        - staff_operator
        - guest_collaborator

    # Admin-only access with product subscription check (owner/admin only)
    - actions: ["create", "update", "delete"]
      effect: EFFECT_ALLOW
      condition:
        match:
          all:
            of:
              - expr: '["signage"].exists(p, p in P.attr.products)'
      derivedRoles:
        - root_user
        - platform_administrator
        - platform_lead
        - agency_owner
        - agency_manager
        - agency_lead
        - retailer_owner
        - retailer_manager
