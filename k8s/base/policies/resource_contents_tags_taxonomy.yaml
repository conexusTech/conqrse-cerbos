---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "default"
  resource: "contents:tags_taxonomy"
  importDerivedRoles:
    - conqrse_roles
  rules:
    # Read access for any tier holding the product
    - actions: ["list", "view"]
      effect: EFFECT_ALLOW
      condition:
        match:
          all:
            of:
              - expr: '["brand_center", "compliance", "priceTags", "product", "qr", "signage", "ssp", "trade"].exists(p, p in P.attr.products)'
      derivedRoles:
        - root_user
        - platform_administrator
        - platform_lead
        - platform_member
        - platform_collaborator
        - agency_owner
        - agency_manager
        - agency_lead
        - agency_member
        - agency_collaborator
        - retailer_owner
        - retailer_manager
        - team_lead
        - staff_operator
        - guest_collaborator

    # Owner/admin tier — everything except dynamic or system taxonomy keys
    - actions: ["create"]
      effect: EFFECT_ALLOW
      condition:
        match:
          all:
            of:
              - expr: '["brand_center", "compliance", "priceTags", "product", "qr", "signage", "ssp", "trade"].exists(p, p in P.attr.products)'
              - expr: '!((has(R.attr.source) && R.attr.source == "dynamic") || (has(R.attr.origin) && R.attr.origin == "system"))'
      derivedRoles:
        - root_user
        - platform_administrator
        - platform_lead
        - agency_owner
        - agency_manager
        - agency_lead
        - retailer_owner
        - retailer_manager

    # Superuser only — dynamic or system taxonomy keys
    - actions: ["create"]
      effect: EFFECT_ALLOW
      condition:
        match:
          all:
            of:
              - expr: '["brand_center", "compliance", "priceTags", "product", "qr", "signage", "ssp", "trade"].exists(p, p in P.attr.products)'
      derivedRoles:
        - root_user
        - platform_administrator
