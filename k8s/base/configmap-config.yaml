apiVersion: v1
kind: ConfigMap
metadata:
  name: cerbos-config
data:
  cerbos.yaml: |
    server:
      apiExplorerEnabled: false
      httpListenAddr: "0.0.0.0:3592"
      grpcListenAddr: "0.0.0.0:3593"
      adminAPI:
        enabled: true
        adminCredentials:
          username: cerbos
          passwordHash: JDJ5JDEwJHhvTjd2RjhlNEVZa3hmdVFYMWlrME9XOWNDemV5RzlYcERTYUNHVWZkcWo2ODdRdkhIcUcyCgo=
      cors:
        allowedOrigins:
          - cerbos
          - cerbos.production.svc.cluster.local
          - cerbos.conqrse.com
        allowedHeaders:
          - accept
          - content-type
          - user-agent
          - x-requested-with
      requestLimits:
        maxActionsPerResource: 100
        maxResourcesPerRequest: 100

    storage:
      driver: "sqlite3"
      sqlite3:
        # BL-8 — the seed job races live read traffic and loses.
        #
        # A bare `/data/cerbos.db` takes SQLite's defaults: rollback-journal
        # mode, where a reader blocks a writer outright, and a busy timeout of
        # ZERO, so a contended write fails instantly instead of waiting. Cerbos
        # serves authz for the admin BFF continuously, so the seed job writes
        # 117 policies into a database that is always being read.
        #
        # The result is a deploy that dies on `_derived_roles.yaml` — the first
        # file alphabetically, not a malformed one — with a bare
        # `500 Failed to add/update policies`. The real cause,
        # `database is locked (5) (SQLITE_BUSY)`, appears only in the Cerbos pod
        # logs, so the next person reasonably concludes their policy is broken.
        # It has now failed 2 of 2 tag-policy deploys across both environments:
        # the default outcome, not the unlucky one.
        #
        #   journal_mode(WAL)     readers and one writer coexist
        #   busy_timeout(5000)    a contended write waits 5s rather than failing
        #
        # THE SYNTAX IS DRIVER-SPECIFIC AND THE WRONG ONE FAILS SILENTLY.
        # Cerbos 0.51.0 depends on `modernc.org/sqlite` (pure Go) directly;
        # `mattn/go-sqlite3` appears only as an indirect dependency. modernc
        # takes pragmas as repeatable `_pragma=name(value)` parameters and
        # IGNORES unknown keys without complaint.
        #
        # The first attempt at this fix used mattn's spelling —
        # `?_busy_timeout=5000&_journal_mode=WAL` — which modernc discarded.
        # Cerbos logged the DSN back verbatim, so it looked applied, and the
        # staging seed then succeeded, which looked like confirmation. It was
        # not: Cerbos's own rule-table reader still logged SQLITE_BUSY during
        # that seed, and under WAL a reader is never blocked by a writer. The
        # seed passing was timing, not the fix. Verify by the absence of those
        # reader warnings, never by the seed's exit code.
        #
        # Safe to change in place: journal_mode is a persistent property of the
        # database file, converted on first open, and a failed seed was never
        # destructive — Cerbos logs "maintaining last valid state" and keeps
        # serving the previous policy set. The deployment is Recreate/1 replica,
        # so applying this costs the same brief PDP gap the manual remediation
        # already costs.
        dsn: "file:/data/cerbos.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"

    logging:
      level: "info"

    telemetry:
      disabled: true
