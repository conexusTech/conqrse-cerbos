apiVersion: v1
kind: ConfigMap
metadata:
  name: cerbos-seed-script
data:
  seed.py: |
    import os
    import sys
    import time
    import yaml
    import requests
    from requests.auth import HTTPBasicAuth

    CERBOS_BASE_URL = os.environ.get("CERBOS_BASE_URL", "http://cerbos:3592")
    USERNAME = os.environ["CERBOS_ADMIN_USERNAME"]
    PASSWORD = os.environ["CERBOS_ADMIN_PASSWORD"]
    POLICIES_DIR = "/policies"
    MAX_RETRIES = 30
    RETRY_DELAY = 2

    # BL-8 — retry a policy POST that fails with a SERVER error.
    #
    # Cerbos stores policies in SQLite on a volume it is simultaneously serving
    # reads from, so a write can lose a lock race and come back 500. That is
    # transient by definition: the same request succeeds moments later, which is
    # exactly what the manual "restart the pod and re-run the seed" remediation
    # was doing by hand, twice, on two different deploys.
    #
    # The DSN now sets WAL + a 5s busy timeout, which should prevent the race
    # rather than survive it. This is the second layer: cheap, and it means a
    # deploy is not lost to any transient write contention the timeout does not
    # happen to cover.
    #
    # 4xx is NOT retried. A malformed policy is a real error and retrying it
    # just delays the report by ten seconds.
    POST_ATTEMPTS = 4
    POST_BACKOFF = 2


    def wait_for_cerbos():
        for i in range(MAX_RETRIES):
            try:
                r = requests.get(f"{CERBOS_BASE_URL}/_cerbos/health", timeout=5)
                if r.status_code == 200:
                    print("Cerbos is healthy")
                    return
            except Exception:
                pass
            print(f"Waiting for Cerbos... ({i + 1}/{MAX_RETRIES})")
            time.sleep(RETRY_DELAY)
        print("ERROR: Cerbos did not become healthy in time")
        sys.exit(1)


    def seed_policies():
        files = sorted([f for f in os.listdir(POLICIES_DIR) if f.endswith((".yaml", ".yml"))])
        auth = HTTPBasicAuth(USERNAME, PASSWORD)

        for filename in files:
            with open(os.path.join(POLICIES_DIR, filename)) as f:
                policy = yaml.safe_load(f)

            for attempt in range(1, POST_ATTEMPTS + 1):
                r = requests.post(
                    f"{CERBOS_BASE_URL}/admin/policy",
                    json={"policies": [policy]},
                    auth=auth,
                    timeout=10,
                )
                if r.status_code in (200, 201):
                    break
                if r.status_code < 500 or attempt == POST_ATTEMPTS:
                    print(f"ERROR: Failed to seed {filename}: {r.status_code} {r.text}")
                    if r.status_code >= 500:
                        # The response body is just "Failed to add/update
                        # policies". Say where the real cause lives, because the
                        # filename in this message is almost always innocent —
                        # it is simply whichever file was being written when the
                        # lock was contended, and sorted() makes that the first
                        # one alphabetically.
                        print(
                            "HINT: a 5xx here is usually NOT a bad policy. Check the "
                            "Cerbos pod logs for the server-side cause, e.g. "
                            "'database is locked (5) (SQLITE_BUSY)'. Cerbos keeps "
                            "serving its last valid policy set, so nothing is broken "
                            "by this failure."
                        )
                    sys.exit(1)
                print(
                    f"WARN: {filename} got {r.status_code}, retrying "
                    f"({attempt}/{POST_ATTEMPTS - 1}) in {POST_BACKOFF * attempt}s"
                )
                time.sleep(POST_BACKOFF * attempt)
            print(f"Seeded: {filename}")

        print(f"Successfully seeded {len(files)} policies")


    if __name__ == "__main__":
        wait_for_cerbos()
        seed_policies()
